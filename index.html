<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { 'slate-750': '#1e293b' } } }
    }
  </script>
  <style>
    body { background: #0f172a; overflow-x: hidden; }
    .scrollbar-dark { scrollbar-width: thin; scrollbar-color: #334155 transparent; }
    .scrollbar-dark::-webkit-scrollbar { width: 4px; }
    .scrollbar-dark::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-dark::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .scrollbar-dark::-webkit-scrollbar-thumb:hover { background: #475569; }
    * { box-sizing: border-box; }
    .input { display: block; width: 100%; background: #334155; color: white; border-radius: .5rem; padding: .5rem .75rem; font-size: .875rem; outline: none; }
    .input:focus { box-shadow: 0 0 0 2px #3b82f6; }
    .label { display: block; font-size: .75rem; color: #94a3b8; margin-bottom: .25rem; }
    .btn-primary   { background: #2563eb; color: white; font-weight: 500; padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; transition: background 150ms; cursor: pointer; border: none; }
    .btn-primary:hover   { background: #3b82f6; }
    .btn-secondary { background: #334155; color: #cbd5e1; font-weight: 500; padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; transition: background 150ms; cursor: pointer; border: none; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger    { background: rgba(220,38,38,.2); color: #f87171; font-weight: 500; padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; transition: background 150ms; cursor: pointer; border: none; }
    .btn-danger:hover    { background: rgba(220,38,38,.4); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
    .modal-box { background: #1e293b; border-radius: 1rem; padding: 1.5rem; width: 100%; max-width: 28rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); }
  </style>
</head>
<body class="text-slate-100 min-h-screen">
  <div id="app"></div>
  <script src="js/api.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
